<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启程智远集团官网 | 设计作品详情</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ffffff',
                        secondary: '#A1A1AA',
                        cta: '#2563EB',
                        background: '#0a0a0f',
                        text: '#ffffff'
                    },
                    fontFamily: {
                        archivo: ['Archivo', 'sans-serif'],
                        'space-grotesk': ['Space Grotesk', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Archivo', sans-serif;
            background-color: #0a0a0f;
            color: #ffffff;
            overflow-x: hidden;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        
        .image-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        
        .btn-primary {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .copy-success {
            animation: pulse 0.5s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="antialiased">
    <!-- Navigation -->
    <nav class="fixed top-4 left-4 right-4 z-50 rounded-2xl px-6 py-4 flex justify-between items-center max-w-7xl mx-auto backdrop-blur-md bg-black/80 shadow-sm border border-white/10">
        <a href="index.html" class="text-2xl font-bold font-space-grotesk text-white hover:text-cta transition-colors duration-200 cursor-pointer">
            ← 返回首页
        </a>
        <a href="index.html#work" class="text-gray-400 hover:text-white transition-colors duration-200 cursor-pointer">
            查看更多作品
        </a>
    </nav>
    
    <!-- Main Content -->
    <main class="pt-32 pb-20 px-6">
        <div class="max-w-6xl mx-auto">
            <!-- Title Section -->
            <div class="text-center mb-16 reveal">
                <span class="inline-block bg-cta/10 text-cta px-4 py-2 rounded-full text-sm font-medium mb-4">集团品牌官网</span>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-6 leading-tight">
                    多维视觉设计与动态呈现
                </h1>
                <p class="text-xl text-secondary max-w-3xl mx-auto leading-relaxed">
                    通过风格化动效为科技公司打造完整的品牌视觉识别系统
                </p>
            </div>
            
            <!-- Category Navigation Section -->
            <section class="mb-20 reveal">
                <h2 class="text-3xl font-bold mb-8 text-center">视觉精选</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl mx-auto">
                    <!-- 三维视觉设计 -->
                    <a href="3d-design.html" class="group bg-[#18181B] rounded-2xl p-8 shadow-lg hover:shadow-2xl transition-all duration-300 text-center border border-white/10 hover:border-cta/30">
                        <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold mb-2 text-white group-hover:text-cta transition-colors duration-200">三维视觉设计</h3>
                        <p class="text-gray-400 text-sm">三维建模元素与产品的有效结合</p>
                    </a>
                    
                    <!-- 平面品牌物料 -->
                    <a href="brand-material.html" class="group bg-[#18181B] rounded-2xl p-8 shadow-lg hover:shadow-2xl transition-all duration-300 text-center border border-white/10 hover:border-cta/30">
                        <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-green-500 to-teal-600 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                            </svg>
                        </div>
                        <h3 class="text-xl font-bold mb-2 text-white group-hover:text-cta transition-colors duration-200">平面品牌物料</h3>
                        <p class="text-gray-400 text-sm">品牌视觉识别与印刷品设计展示</p>
                    </a>
                    

                </div>
            </section>
            

        </div>
    </main>
    
    <!-- Footer -->
    <footer class="py-8 px-6 border-t border-white/10">
        <div class="max-w-7xl mx-auto text-center">
            <p class="text-gray-400 text-sm">
                © 2026 杨一楠。All rights reserved.
            </p>
        </div>
    </footer>
    
    <!-- Copy Success Toast -->
    <div class="fixed bottom-6 right-6 bg-green-500 text-white px-6 py-4 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300" id="copy-toast">
        <div class="flex items-center">
            <svg class="w-6 h-6 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>链接已复制到剪贴板！</span>
        </div>
    </div>
    
    <script>
        // Scroll Reveal Animation
        function reveal() {
            const reveals = document.querySelectorAll('.reveal');
            
            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 100;
                
                if (elementTop < windowHeight - elementVisible) {
                    element.classList.add('active');
                }
            });
        }
        
        window.addEventListener('scroll', reveal);
        reveal(); // Initial check
        
        // Copy Link Functionality
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const projectUrl = document.getElementById('project-url');
        const copyToast = document.getElementById('copy-toast');
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(projectUrl.value).then(() => {
                // Show success state
                copyBtn.classList.add('copy-success');
                copyText.textContent = '已复制！';
                
                // Show toast
                copyToast.classList.remove('translate-y-20', 'opacity-0');
                
                setTimeout(() => {
                    copyBtn.classList.remove('copy-success');
                    copyText.textContent = '复制链接';
                    copyToast.classList.add('translate-y-20', 'opacity-0');
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                copyText.textContent = '复制失败';
                setTimeout(() => {
                    copyText.textContent = '复制链接';
                }, 2000);
            });
        });
        
        // Initialize
        console.log('Project detail page loaded successfully!');
    </script>
</body>
</html>
