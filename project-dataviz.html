    <script>
        // Scroll Reveal Animation
        function reveal() {
            const reveals = document.querySelectorAll('.reveal');
            
            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 100;
                
                if (elementTop < windowHeight - elementVisible) {
                    element.classList.add('active');
                }
            });
        }
        
        window.addEventListener('scroll', reveal);
        reveal(); // Initial check
        
        // Copy MiniProgram Name Functionality
        const copyMiniProgramBtn = document.getElementById('copy-miniprogram-btn');
        const copyMiniProgramText = document.getElementById('copy-miniprogram-text');
        const copyToast = document.getElementById('copy-toast');
        
        if (copyMiniProgramBtn) {
            copyMiniProgramBtn.addEventListener('click', () => {
                navigator.clipboard.writeText('力企云 SaaS').then(() => {
                    // Show success state
                    copyMiniProgramBtn.classList.add('copy-success');
                    copyMiniProgramText.textContent = '已复制！';
                    
                    // Show toast
                    copyToast.classList.remove('translate-y-20', 'opacity-0');
                    
                    setTimeout(() => {
                        copyMiniProgramBtn.classList.remove('copy-success');
                        copyMiniProgramText.textContent = '复制名称';
                        copyToast.classList.add('translate-y-20', 'opacity-0');
                    }, 2000);
                }).catch(err => {
                    console.error('复制失败:', err);
                    copyMiniProgramText.textContent = '复制失败';
                    setTimeout(() => {
                        copyMiniProgramText.textContent = '复制名称';
                    }, 2000);
                });
            });
        }
        
        // Phone Screen Drag to Scroll Functionality
        const screenContents = document.querySelectorAll('.screen-content');
        
        screenContents.forEach(content => {
            let isDragging = false;
            let startY = 0;
            let scrollTop = 0;
            
            // Mouse events
            content.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.clientY - scrollTop;
                content.style.cursor = 'grabbing';
                e.preventDefault();
            });
            
            content.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                scrollTop = e.clientY - startY;
                content.scrollTop = scrollTop;
                e.preventDefault();
            });
            
            content.addEventListener('mouseup', () => {
                isDragging = false;
                content.style.cursor = 'grab';
            });
            
            content.addEventListener('mouseleave', () => {
                isDragging = false;
                content.style.cursor = 'grab';
            });
            
            // Touch events for mobile
            content.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY - scrollTop;
                e.preventDefault();
            }, { passive: false });
            
            content.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                scrollTop = e.touches[0].clientY - startY;
                content.scrollTop = scrollTop;
                e.preventDefault();
            }, { passive: false });
            
            content.addEventListener('touchend', () => {
                isDragging = false;
            });
        });
        
        // Image Modal / Lightbox Functionality
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const modalClose = document.getElementById('modal-close');
        
        // Add click event to all phone screen images
        const phoneImages = document.querySelectorAll('.phone-model-wrapper .screen-content img');
        
        phoneImages.forEach(img => {
            img.addEventListener('click', () => {
                const imgSrc = img.src;
                modalImage.src = imgSrc;
                imageModal.classList.add('active');
                document.body.style.overflow = 'hidden'; // Prevent body scroll
            });
        });
        
        // Close modal function
        function closeModal() {
            imageModal.classList.remove('active');
            document.body.style.overflow = ''; // Restore body scroll
        }
        
        // Close on close button click
        if (modalClose) {
            modalClose.addEventListener('click', closeModal);
        }
        
        // Close on modal background click
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                closeModal();
            }
        });
        
        // Close on Escape key press
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && imageModal.classList.contains('active')) {
                closeModal();
            }
        });
        
        // Initialize
        console.log('Project detail page loaded successfully!');
    </script>
</body>
</html>
